name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# PR checks and production deployment use DIFFERENT concurrency groups so that
# a stuck or slow PR check never cancels a real production deploy, and vice versa.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && 'deploy' || 'check' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ------------------------------------------------------------------
  # PR checks: run on pull_request and workflow_dispatch from non-main refs.
  # Does NOT publish to Pages, does NOT deploy, does NOT write to github-pages
  # environment. Uploads Playwright artifacts for review.
  # ------------------------------------------------------------------
  pr-checks:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run unit tests (test_*.py)
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Build site
        run: |
          python3 scripts/build_site.py --output .site-build
          python3 scripts/personalize_site.py .site-build

      - name: Install Playwright + Chromium
        run: |
          python3 -m pip install --quiet playwright==1.57.0
          python3 -m playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: Browser checks — desktop (1440x900)
        run: |
          python3 scripts/verify_site_browser.py .site-build

      - name: Upload Playwright artifacts (screenshots + JSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-check-screenshots
          path: ${{ runner.temp }}/site-ui-check
          if-no-files-found: ignore
          retention-days: 14

  # ------------------------------------------------------------------
  # Production deploy: only runs on push to main (or manual dispatch on main).
  # Pull requests are EXPLICITLY excluded — never publish a PR branch.
  # ------------------------------------------------------------------
  deploy:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: []
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run unit tests
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Build unified reading interface
        run: |
          python3 scripts/build_site.py --output .site-build
          python3 scripts/personalize_site.py .site-build

      - name: Install Playwright + Chromium
        run: |
          python3 -m pip install --quiet playwright==1.57.0
          python3 -m playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: Browser checks for site-wide changes
        run: |
          python3 scripts/verify_site_browser.py .site-build

      - name: Upload Playwright artifacts (screenshots + JSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-screenshots
          path: ${{ runner.temp }}/site-ui-check
          if-no-files-found: ignore
          retention-days: 14

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .site-build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public reader pages
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import json, os, re, time, urllib.request
          base=os.environ['SITE_URL'].rstrip('/')
          paths=['/','/about.html','/posts/','/projects/','/podcast/','/projects/shuge-exhibition-v1.0/rooms/room2/','/projects/shuge/research/water-classic/yishui/article/','/site-map/','/site-guide/','/projects/wbw-spacex-mars-cn/','/posts/site-design-evidence-layers.html','/projects/site-design-lab/','/content-index/','/projects/site-design-lab/shuge-evidence-exhibition/','/projects/site-design-lab/shuge-source-register/','/projects/site-design-lab/shuge-source-crosswalk/']
          result=[]
          for path in paths:
              error=None
              for attempt in range(4):
                  try:
                      request=urllib.request.Request(base+path+'?build='+os.environ['GITHUB_SHA'],headers={'Cache-Control':'no-cache','User-Agent':'Conan-Xin-Reader-Check'})
                      with urllib.request.urlopen(request,timeout=25) as response:
                          body=response.read().decode('utf-8')
                          assert response.status==200
                          native=(path=='/projects/wbw-spacex-mars-cn/')
                          theme='project-native' if native else 'unified-v1'
                          assert 'data-site-theme="'+theme+'"' in body,'reader theme not in public response'
                          if native:
                              assert 'data-theme="deep-space"' in body,'Mars HTML native theme missing'
                              assert 'href="#main"' in body,'Mars skip link missing'
                              assert not re.search(r'<body\b[^>]*\bsite-unified\b',body),'Mars global theme leaked'
                          if path in ('/posts/site-design-evidence-layers.html','/projects/site-design-lab/'):
                              assert 'TEMPLATE_' not in body,'template placeholder published'
                              assert 'id="evidence"' in body and 'id="citation"' in body,'evidence structure missing'
                          if path in ('/projects/site-design-lab/shuge-evidence-exhibition/','/projects/site-design-lab/shuge-source-register/'):
                              expected='exhibition' if 'exhibition' in path else 'reference'
                              assert 'class="template-'+expected+'"' in body,'SHUGE template not used'
                              assert 'site-index-kind' in body,'SHUGE index metadata missing'
                              assert 'TEMPLATE_' not in body,'SHUGE template placeholders leaked'
                              assert 'CLAIM_SUPPORT_AUDIT.md' in body,'SHUGE source audit link missing'
                          if path=='/content-index/':
                              assert 'id="index-search"' in body and 'id="index-kind"' in body,'catalog filter missing'
                              assert '/projects/site-design-lab/shuge-evidence-exhibition/' in body,'exhibition not indexed'
                              assert '/projects/site-design-lab/shuge-source-register/' in body,'reference not indexed'
                              with urllib.request.urlopen(base+'/assets/site/content-index.json?build='+os.environ['GITHUB_SHA'],timeout=25) as data_response:
                                  catalog=json.loads(data_response.read().decode('utf-8'))
                                  assert catalog['total']>15,'empty content index'
                                  assert catalog['counts']['exhibition']>=1 and catalog['counts']['reference']>=1,'missing catalog categories'
                                  assert not any('/source/' in item['url'] for item in catalog['items']),'source paths leaked to catalog'
                          if path=='/projects/site-design-lab/shuge-source-crosswalk/':
                              assert 'work-shuge-168491' in body and 'work-shuge-211203' in body and 'work-shuge-44159' in body,'crosswalk rows missing'
                              assert 'UNVERIFIED' in body and 'NOT_FOUND' in body,'crosswalk status labels missing'
                              assert 'site-index-kind' in body,'crosswalk not classified'
                              with urllib.request.urlopen(base+path+'crosswalk.json?build='+os.environ['GITHUB_SHA'],timeout=25) as source_response:
                                  data=json.loads(source_response.read().decode('utf-8'))
                                  assert len(data['rows'])==3,'crosswalk must contain three frozen records'
                                  assert all(r['numeric_id_to_candidate']['status']=='UNVERIFIED' for r in data['rows']),'unproven binding promoted to verified'
                                  assert all(r['external_candidate']['status']=='VERIFIED' for r in data['rows']),'public Shuge candidate check missing'
                          assert 'data-site-identity="conan-xin-v1"' in body,'public identity not updated'
                          assert re.search(r'class="site-brand"[^>]*>Conan Xin',body),'public brand not updated'
                          assert 'mailto:conanxin@gmail.com' in body,'public contact missing'
                          assert '/assets/site/design.css' in body,'shared stylesheet missing'
                          if path=='/about.html':
                              assert '工程师、独立研究者与数字工具实践者' in body
                              assert 'Windows 10' not in body and 'coming soon' not in body
                          row={'url':base+path,'http':response.status,'identity':'Conan Xin'}
                          result.append(row)
                          print(json.dumps(row,ensure_ascii=False),flush=True)
                      error=None
                      break
                  except Exception as exc:
                      error=exc
                      if attempt<3: time.sleep(10)
              if error: raise RuntimeError(f'{path}: {error}')
          print('PUBLIC_IDENTITY_VERIFICATION=PASS',len(result))
          PY
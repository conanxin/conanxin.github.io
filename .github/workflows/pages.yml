name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build unified reading interface
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 scripts/build_site.py --output .site-build
          python3 scripts/personalize_site.py .site-build
      - name: Browser checks for site-wide changes
        if: contains(github.event.head_commit.message, 'site-wide') || github.event_name == 'workflow_dispatch'
        run: |
          python3 -m pip install --quiet playwright==1.57.0
          if ! command -v google-chrome && ! command -v chromium; then
            python3 -m playwright install --with-deps chromium
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
          python3 scripts/verify_site_browser.py .site-build
      - name: Keep browser check evidence
        if: always() && (contains(github.event.head_commit.message, 'site-wide') || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: site-ui-check
          path: ${{ runner.temp }}/site-ui-check
          if-no-files-found: ignore
          retention-days: 7
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .site-build
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public reader pages
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import json, os, re, time, urllib.request
          base=os.environ['SITE_URL'].rstrip('/')
          paths=['/','/about.html','/posts/','/projects/','/podcast/','/projects/shuge-exhibition-v1.0/rooms/room2/','/projects/shuge/research/water-classic/yishui/article/','/site-map/']
          result=[]
          for path in paths:
              error=None
              for attempt in range(4):
                  try:
                      request=urllib.request.Request(base+path+'?build='+os.environ['GITHUB_SHA'],headers={'Cache-Control':'no-cache','User-Agent':'Conan-Xin-Reader-Check'})
                      with urllib.request.urlopen(request,timeout=25) as response:
                          body=response.read().decode('utf-8')
                          assert response.status==200
                          assert 'data-site-theme="unified-v1"' in body,'reader theme not in public response'
                          assert 'data-site-identity="conan-xin-v1"' in body,'public identity not updated'
                          assert re.search(r'class="site-brand"[^>]*>Conan Xin',body),'public brand not updated'
                          assert 'mailto:conanxin@gmail.com' in body,'public contact missing'
                          assert '/assets/site/design.css' in body,'shared stylesheet missing'
                          if path=='/about.html':
                              assert '工程师、独立研究者与数字工具实践者' in body
                              assert 'Windows 10' not in body and 'coming soon' not in body
                          row={'url':base+path,'http':response.status,'identity':'Conan Xin'}
                          result.append(row)
                          print(json.dumps(row,ensure_ascii=False),flush=True)
                      error=None
                      break
                  except Exception as exc:
                      error=exc
                      if attempt<3: time.sleep(10)
              if error: raise RuntimeError(f'{path}: {error}')
          print('PUBLIC_IDENTITY_VERIFICATION=PASS',len(result))
          PY

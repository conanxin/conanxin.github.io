name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# PR checks and production deployment use DIFFERENT concurrency groups so that
# a stuck or slow PR check never cancels a real production deploy, and vice versa.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && 'deploy' || 'check' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ------------------------------------------------------------------
  # PR checks: run on pull_request and workflow_dispatch from non-main refs.
  # Does NOT publish to Pages, does NOT deploy, does NOT write to github-pages
  # environment. Uploads Playwright artifacts for review.
  # ------------------------------------------------------------------
  pr-checks:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run unit tests (test_*.py)
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Build site
        run: |
          python3 scripts/build_site.py --output .site-build
          python3 scripts/personalize_site.py .site-build

      - name: Install Playwright + Chromium
        run: |
          python3 -m pip install --quiet playwright==1.57.0
          python3 -m playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: Browser checks — desktop (1440x900)
        run: |
          python3 scripts/verify_site_browser.py .site-build

      - name: Upload Playwright artifacts (screenshots + JSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-check-screenshots
          path: ${{ runner.temp }}/site-ui-check
          if-no-files-found: ignore
          retention-days: 14

  # ------------------------------------------------------------------
  # Production deploy: only runs on push to main (or manual dispatch on main).
  # Pull requests are EXPLICITLY excluded — never publish a PR branch.
  # ------------------------------------------------------------------
  deploy:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: []
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run unit tests
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Build unified reading interface
        run: |
          python3 scripts/build_site.py --output .site-build
          python3 scripts/personalize_site.py .site-build

      - name: Install Playwright + Chromium
        run: |
          python3 -m pip install --quiet playwright==1.57.0
          python3 -m playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: Browser checks for site-wide changes
        run: |
          python3 scripts/verify_site_browser.py .site-build

      - name: Upload Playwright artifacts (screenshots + JSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-screenshots
          path: ${{ runner.temp }}/site-ui-check
          if-no-files-found: ignore
          retention-days: 14

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .site-build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public reader pages
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import json, os, re, time, urllib.request, urllib.parse
          base=os.environ['SITE_URL'].rstrip('/')
          paths=['/','/about.html','/posts/','/projects/','/podcast/','/projects/shuge-exhibition-v1.0/rooms/room2/','/projects/shuge/research/water-classic/yishui/article/','/site-map/','/site-guide/','/projects/wbw-spacex-mars-cn/','/posts/site-design-evidence-layers.html','/projects/site-design-lab/','/content-index/','/projects/site-design-lab/shuge-evidence-exhibition/','/projects/site-design-lab/shuge-source-register/','/projects/site-design-lab/shuge-source-crosswalk/','/projects/site-design-lab/shuge-source-crosswalk/primary-catalog/','/projects/site-design-lab/shuge-source-crosswalk/scan-locator/','/projects/yarvin-moldbug-cn/']
          result=[]
          for path in paths:
              error=None
              for attempt in range(4):
                  try:
                      request=urllib.request.Request(base+path+'?build='+os.environ['GITHUB_SHA'],headers={'Cache-Control':'no-cache','User-Agent':'Conan-Xin-Reader-Check'})
                      with urllib.request.urlopen(request,timeout=25) as response:
                          body=response.read().decode('utf-8')
                          assert response.status==200
                          native=(path=='/projects/wbw-spacex-mars-cn/')
                          theme='project-native' if native else 'unified-v1'
                          assert 'data-site-theme="'+theme+'"' in body,'reader theme not in public response'
                          if native:
                              assert 'data-theme="deep-space"' in body,'Mars HTML native theme missing'
                              assert 'href="#main"' in body,'Mars skip link missing'
                              assert not re.search(r'<body\b[^>]*\bsite-unified\b',body),'Mars global theme leaked'
                          if path in ('/posts/site-design-evidence-layers.html','/projects/site-design-lab/'):
                              assert 'TEMPLATE_' not in body,'template placeholder published'
                              assert 'id="evidence"' in body and 'id="citation"' in body,'evidence structure missing'
                          if path in ('/projects/site-design-lab/shuge-evidence-exhibition/','/projects/site-design-lab/shuge-source-register/'):
                              expected='exhibition' if 'exhibition' in path else 'reference'
                              assert 'class="template-'+expected+'"' in body,'SHUGE template not used'
                              assert 'site-index-kind' in body,'SHUGE index metadata missing'
                              assert 'TEMPLATE_' not in body,'SHUGE template placeholders leaked'
                              assert 'CLAIM_SUPPORT_AUDIT.md' in body,'SHUGE source audit link missing'
                          if path=='/content-index/':
                              assert 'id="index-search"' in body and 'id="index-kind"' in body,'catalog filter missing'
                              assert '/projects/site-design-lab/shuge-evidence-exhibition/' in body,'exhibition not indexed'
                              assert '/projects/site-design-lab/shuge-source-register/' in body,'reference not indexed'
                              assert '/projects/site-design-lab/shuge-source-crosswalk/' in body,'stage2e source crosswalk not indexed'
                              assert '/projects/site-design-lab/shuge-source-crosswalk/primary-catalog/' in body,'stage2f primary catalog not indexed'
                              assert '/projects/site-design-lab/shuge-source-crosswalk/scan-locator/' in body,'stage2g scan locator not indexed'
                              with urllib.request.urlopen(base+'/assets/site/content-index.json?build='+os.environ['GITHUB_SHA'],timeout=25) as data_response:
                                  catalog=json.loads(data_response.read().decode('utf-8'))
                                  assert catalog['total']>15,'empty content index'
                                  assert catalog['counts']['exhibition']>=1 and catalog['counts']['reference']>=1,'missing catalog categories'
                                  assert not any('/source/' in item['url'] for item in catalog['items']),'source paths leaked to catalog'
                                  assert sum(item['url']=='/projects/site-design-lab/shuge-source-crosswalk/' and item['kind']=='reference' for item in catalog['items'])==1,'stage2e reader not uniquely indexed'
                                  assert sum(item['url']=='/projects/site-design-lab/shuge-source-crosswalk/primary-catalog/' and item['kind']=='reference' for item in catalog['items'])==1,'stage2f primary catalog not uniquely indexed'
                                  assert sum(item['url']=='/projects/site-design-lab/shuge-source-crosswalk/scan-locator/' and item['kind']=='reference' for item in catalog['items'])==1,'stage2g scan locator not uniquely indexed'
                          if path=='/projects/site-design-lab/shuge-source-crosswalk/':
                              assert 'work-shuge-168491' in body and 'work-shuge-211203' in body and 'work-shuge-44159' in body,'crosswalk rows missing'
                              assert 'UNVERIFIED' in body and 'NOT_FOUND' in body,'crosswalk status labels missing'
                              assert 'site-index-kind' in body,'crosswalk not classified'
                              with urllib.request.urlopen(base+path+'crosswalk.json?build='+os.environ['GITHUB_SHA'],timeout=25) as source_response:
                                  data=json.loads(source_response.read().decode('utf-8'))
                                  assert len(data['rows'])==3,'crosswalk must contain three frozen records'
                                  assert all(r['archived_post_record']['status']=='VERIFIED' for r in data['rows']),'archive ID-to-URL evidence missing'
                                  assert all(r['external_page_observation']['status']=='VERIFIED' for r in data['rows']),'public Shuge works not checked'
                                  assert all(r['institution_catalog_item']['status']=='UNVERIFIED' for r in data['rows']),'unverified archive holder promoted to verified'
                                  assert data['corrected_prior_inference']['related_post_id']==124575,'Water Classic numeric ID correction missing'
                          if path=='/projects/site-design-lab/shuge-source-crosswalk/primary-catalog/':
                              assert 'class="template-reference"' in body,'Stage2F not using reference template'
                              for name in ('子076-0004','Chinois 5563','史112-0007','297-0020','SHUGE:p211203:1338'):
                                  assert name in body,'primary catalog identity/citation missing: '+name
                              assert 'TEMPLATE_' not in body,'Stage2F template placeholders leaked'
                              request_json=urllib.request.Request(base+'/projects/site-design-lab/shuge-source-crosswalk/primary-catalog-audit.json?build='+os.environ['GITHUB_SHA'],headers={'Cache-Control':'no-cache'})
                              with urllib.request.urlopen(request_json,timeout=25) as cat_response:
                                  audit=json.loads(cat_response.read().decode('utf-8'))
                                  assert audit['summary']['books_with_primary_catalog_record_found']==3
                                  assert audit['summary']['primary_repository_catalog_candidate_count']==4
                                  assert audit['summary']['citation_ids_occurring_in_citations_json_runs']==1
                                  assert audit['summary']['matching_shuge_to_exact_holder_scans_verified']==0
                                  assert len(audit['citation_audit'])==6
                                  assert all(c['claim_semantics']['status']=='UNVERIFIED' for c in audit['citation_audit'])
                          if path=='/projects/site-design-lab/shuge-source-crosswalk/scan-locator/':
                              assert 'class="template-reference"' in body,'Stage2G not using shared reference template'
                              for key in ('C103160581800','C103160611900','SHUGE:p211203:1338','f274','UNVERIFIED'):
                                  assert key in body,'Stage2G evidence locator missing: '+key
                              assert 'TEMPLATE_' not in body,'Stage2G template placeholder leaked'
                              probe=urllib.request.Request(base+'/projects/site-design-lab/shuge-source-crosswalk/scan-locator-audit.json?build='+os.environ['GITHUB_SHA'],headers={'Cache-Control':'no-cache'})
                              with urllib.request.urlopen(probe,timeout=25) as scan_response:
                                  scan=json.loads(scan_response.read().decode('utf-8'))
                                  assert scan['summary']['archived_works']==3
                                  assert scan['summary']['japan_observed_image_locator_ids']==6
                                  assert scan['summary']['downloaded_original_image_binaries']==0
                                  assert scan['summary']['verified_image_pair_alignments']==0
                                  assert scan['summary']['verified_citation_claim_semantics']==0
                                  assert len(scan['citation_rows'])==6
                                  assert scan['locator_hypothesis']['projection_is_forbidden']
                          if path=='/projects/yarvin-moldbug-cn/':
                              # This gate fetches the LIVE GitHub Pages output, not .site-build files.
                              assert 'Curtis Yarvin 思想导读' in body and 'Conan Xin 数字花园' in body,'Yarvin public title missing'
                              assert 'id="article"' in body and 'id="glossaryGrid"' in body,'Yarvin article or glossary missing'
                              assert 'id="searchOverlay"' in body and 'id="tocDrawer"' in body,'Yarvin reader controls missing'
                              assert 'data-reading-mode="annotated"' in body,'Yarvin reading defaults missing'
                              assert 'id="source-ledger-section"' in body,'P4 source ledger UI missing'
                              assert len(re.findall(r'class="source-ledger__card"',body))==9,'P4 nine static cards missing'
                              assert 'id="passage-review-section"' in body,'P5 review section missing'
                              assert len(re.findall(r'class="passage-review__card"',body))==3,'P5 three quote cards missing'
                              assert 'id="tri-layer-section"' in body,'P6 source comparison section missing'
                              assert len(re.findall(r'class="tri-layer__case"',body))==3,'P6 3 static cards missing'
                              assert 'id="preface-draft-section"' in body,'P7 approval workspace missing'
                              assert len(re.findall(r'class="preface-editorial__paragraph"',body))==4,'P7 four preface drafts missing'
                              assert len(re.findall(r'class="preface-editorial__decision"',body))==4,'P7 editorial choices missing'
                              css_match=re.search(r'href="([^"]*styles[.]css[?][^"]+)"',body)
                              js_match=re.search(r'src="([^"]*app[.]js[?][^"]+)"',body)
                              assert css_match and js_match,'Yarvin versioned CSS/JS links missing'
                              ledger_js=re.search(r'src="([^"]*source-ledger[.]js[?][^"]+)"',body)
                              assert ledger_js,'P4 filter JS missing in HTML'
                              for kind,relative in (
                                  ('css',css_match.group(1)),
                                  ('js',js_match.group(1)),
                                  ('json','content/background.json'),
                                  ('ledgerjs',ledger_js.group(1)),
                                  ('ledger','content/source-ledger.json'),
                                  ('passages','content/passage-alignments.json'),
                                  ('p6','content/three-layer-review.json'),
                                  ('p7','content/preface-draft-p7.json'),
                              ):
                                  asset_url=urllib.parse.urljoin(base+path,relative)
                                  separator='&' if '?' in asset_url else '?'
                                  asset_request=urllib.request.Request(
                                      asset_url+separator+'build='+os.environ['GITHUB_SHA'],
                                      headers={'Cache-Control':'no-cache','User-Agent':'Conan-Xin-Yarvin-Public-Gate'})
                                  with urllib.request.urlopen(asset_request,timeout=25) as asset_response:
                                      assert asset_response.status==200,'Yarvin '+kind+' missing on public site'
                                      asset_body=asset_response.read().decode('utf-8')
                                      assert len(asset_body)>100,'Yarvin '+kind+' unexpectedly empty'
                                  if kind=='css':
                                      assert '.search-overlay[hidden]' in asset_body,'hidden search-overlay fix absent from public CSS'
                                      assert 'body.site-unified .hero' in asset_body,'unified hero absent from public CSS'
                                      assert 'var(--site-green)' in asset_body,'shared site token absent from public CSS'
                                  elif kind=='js':
                                      assert 'content/background.json' in asset_body,'data URL missing from public JS'
                                      assert 'initSearch(corpus)' in asset_body,'search initialization missing from public JS'
                                  elif kind=='ledgerjs':
                                      assert 'function applyFilters()' in asset_body,'source filter script missing'
                                      assert 'source-ledger__card' in asset_body,'source filter selector missing'
                                  elif kind=='ledger':
                                      evidence=json.loads(asset_body)
                                      audit=evidence['audit']
                                      assert audit['chapter_total']==9 and audit['source_total']==10,'P4 source rows incomplete'
                                      assert audit['located_source_pages']==10,'P4 source pages incomplete'
                                      assert audit['original_editorial_fulltext_retrieved'],'Spanish editorial original not marked retrieved'
                                      assert not audit['english_421_version_retrieved'],'421 English version falsely marked available'
                                      assert audit['translation_paragraphs_verified']==0,'P4 false translation verification'
                                      assert audit['p5_ai_preliminary_clause_pairs']==3,'P5 unlinked to P4 audit'
                                      assert audit['p5_human_approved_pairs']==0,'P5 P4-side human gate incorrectly passed'
                                      assert audit['historical_political_claims_independently_verified']==0,'P4 false claim verification'
                                      assert len(evidence['chapters'])==9,'P4 chapter rows incomplete'
                                      assert all(c['claim_semantics']=='NOT_EVALUATED' for c in evidence['chapters'])
                                      for record in evidence['chapters']:
                                          assert 'id="source-ledger-ch'+str(record['chapter_no'])+'"' in body,'P4 public chapter absent'
                                          assert 'href="#'+record['chapter_anchor']+'"' in body,'P4 translation anchor absent'
                                      source_ids={entry['id'] for entry in evidence['sources']}
                                      assert all(rel['source_id'] in source_ids for c in evidence['chapters'] for rel in c['relations'])
                                  elif kind=='passages':
                                      comparison=json.loads(asset_body)
                                      audit=comparison['audit']
                                      assert comparison['stage']=='P5_AI_PRELIMINARY_CLAUSE_COMPARISON','wrong P5 release status'
                                      assert audit['candidate_pairs']==3,'incomplete P5 pairs'
                                      assert audit['human_approved_pairs']==0,'P5 human approval invented'
                                      assert audit['full_translation_paragraphs_verified']==0,'false full translation certification'
                                      assert audit['political_historical_claims_verified']==0,'false political claim certification'
                                      assert audit['editorial_421_article_retrieved'],'Spanish publisher original not marked retrieved'
                                      assert not audit['english_421_translation_retrieved'],'publisher English version falsely retrieved'
                                      assert [p['chapter'] for p in comparison['pairs']]==[5,7,9],'P5 chapter mapping changed'
                                      assert all(p['comparison_status']=='AI_PRELIMINARY_REVIEW' for p in comparison['pairs'])
                                      assert all(p['human_approval']=='PENDING' for p in comparison['pairs'])
                                      for review in comparison['pairs']:
                                          assert 'data-pair-id="'+review['id']+'"' in body,'P5 public review missing'
                                          assert 'id="passage-review-ch'+str(review['chapter'])+'"' in body,'P5 review anchor missing'
                                  elif kind=='p6':
                                      original=json.loads(asset_body)
                                      audit=original['audit']
                                      assert original['stage']=='P6_ES_ORIGINAL_THREE_LAYER_PRELIMINARY','unexpected P6 stage'
                                      assert audit['spanish_original_article_retrieved'],'Spanish original not retrieved'
                                      assert not audit['english_421_version_retrieved'],'English 421 translation falsely retrieved'
                                      assert audit['spanish_headings_located']==9 and audit['chinese_headings_mapped']==9,'P6 chapter map missing'
                                      assert audit['spanish_preface_present'] and not audit['chinese_preface_present_in_article'],'P6 missing-intro gap'
                                      assert audit['three_layer_clause_cases']==3,'P6 quote triplets missing'
                                      assert audit['human_approved_cases']==0,'P6 human approval invented'
                                      assert audit['p7_preface_draft_paragraphs']==4,'P7 not linked to P6 gap'
                                      assert audit['p7_editorial_decisions_approved']==0,'P7 P6-side approval gate violated'
                                      assert audit['p7_preface_paragraphs_published_to_article']==0,'P7 introduction prematurely inserted'
                                      assert audit['full_zh_translation_paragraphs_verified']==0,'P6 full translation certified without review'
                                      assert audit['independent_historical_political_facts_verified']==0,'P6 political facts invented'
                                      assert len(original['heading_map'])==9 and len(original['triplets'])==3
                                      assert all(c['human_approval']=='PENDING' for c in original['triplets'])
                                      assert all('data-p6-id="'+c['id']+'"' in body for c in original['triplets'])
                                      assert '/es/curtis-yarvin-democracia-monarquia-neorreaccion-neocameralismo/' in body,'Spanish source URL missing'
                                  elif kind=='p7':
                                      draft=json.loads(asset_body)
                                      audit=draft['audit']
                                      assert draft['stage']=='P7_PREFACE_AND_EDITORIAL_PROPOSALS','P7 wrong phase state'
                                      assert audit['source_intro_narrative_paragraphs']==4,'source preface count drift'
                                      assert audit['source_repeated_pullquotes']==1,'duplicate pullquote conflated with narrative paragraph'
                                      assert audit['chinese_preface_draft_paragraphs']==4,'P7 preface draft incomplete'
                                      assert audit['draft_paragraphs_human_approved']==0,'P7 preface implicitly approved'
                                      assert audit['editorial_decisions_total']==4,'P7 editorial decisions incomplete'
                                      assert audit['editorial_decisions_approved']==0,'P7 approval not granted'
                                      assert audit['frozen_article_edits_applied']==0,'P7 frozen translation changed'
                                      assert not audit['whole_article_translation_reviewed'],'full translation audit falsely claimed'
                                      assert len(draft['preface_paragraphs'])==4 and len(draft['editorial_decisions'])==4
                                      assert all(p['editorial_approval']=='PENDING' for p in draft['preface_paragraphs'])
                                      assert all(x['status']=='PENDING_EDITORIAL_APPROVAL' for x in draft['editorial_decisions'])
                                      assert all('data-p7-paragraph-id="'+p['paragraph_id']+'"' in body for p in draft['preface_paragraphs'])
                                      assert all('data-p7-decision-id="'+d['id']+'"' in body for d in draft['editorial_decisions'])
                                      assert 'href="content/preface-draft-p7.json"' in body
                                  else:
                                      data=json.loads(asset_body)
                                      assert data['project']=='yarvin-moldbug-cn','wrong public JSON project'
                                      assert len(data['timeline'])>0 and len(data['reading_paths'])==4,'Yarvin data incomplete'
                                      count_match=re.search(r'id="statGlossary">([0-9]+)</div>',body)
                                      assert count_match,'public glossary count element missing'
                                      shown=int(count_match.group(1))
                                      prerendered=len(re.findall(r'class="glossary-card"',body))
                                      assert shown==prerendered==len(data['glossary']),('glossary count drift',shown,prerendered,len(data['glossary']))
                                  print(json.dumps({'public_asset':asset_url,'http':200,'kind':kind},ensure_ascii=False),flush=True)
                          assert 'data-site-identity="conan-xin-v1"' in body,'public identity not updated'
                          assert re.search(r'class="site-brand"[^>]*>Conan Xin',body),'public brand not updated'
                          assert 'mailto:conanxin@gmail.com' in body,'public contact missing'
                          assert '/assets/site/design.css' in body,'shared stylesheet missing'
                          if path=='/about.html':
                              assert '工程师、独立研究者与数字工具实践者' in body
                              assert 'Windows 10' not in body and 'coming soon' not in body
                          row={'url':base+path,'http':response.status,'identity':'Conan Xin'}
                          result.append(row)
                          print(json.dumps(row,ensure_ascii=False),flush=True)
                      error=None
                      break
                  except Exception as exc:
                      error=exc
                      if attempt<3: time.sleep(10)
              if error: raise RuntimeError(f'{path}: {error}')
          print('PUBLIC_IDENTITY_VERIFICATION=PASS',len(result))
          PY
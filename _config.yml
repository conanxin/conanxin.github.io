# Conan Xin - GitHub Pages metadata and legacy Jekyll configuration
# Active publication uses .github/workflows/pages.yml and the reader build.
title: Conan Xin
description: 以工程实践连接历史文献、数字档案、文化田野与人工智能，记录研究、阅读和创造性实验
author: Conan Xin
email: conanxin@gmail.com
theme: jekyll-theme-minimal
baseurl: ""
url: "https://conanxin.github.io"
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
exclude:
  - README.md
  - SESSION-*.md
  - "*.py"
  - "__pycache__"
  - "*.pyc"
  - Gemfile
  - Gemfile.lock
  - node_modules
nav:
  - title: 首页
    url: /
  - title: 文章
    url: /posts/
  - title: 项目
    url: /projects/
  - title: 文献研究
    url: /projects/shuge/
  - title: 播客
    url: /podcast/
  - title: 关于
    url: /about.html
social:
  github: conanxin
  twitter: porco7161
license: "CC BY-SA 4.0"
license_url: "https://creativecommons.org/licenses/by-sa/4.0/"
